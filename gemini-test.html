
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ATELIER — Gemini AI Test</title>

<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 30px;
    color: #222;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 2px;
  }

  #preview {
    display: none;
    max-width: 280px;
    max-height: 350px;
    object-fit: contain;
    margin: 20px 0;
    border-radius: 8px;
  }

  button {
    padding: 12px 22px;
    background: #222;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #status {
    color: #666;
    margin-top: 20px;
  }

  .result {
    padding: 15px 0;
    border-bottom: 1px solid #ddd;
  }

  .label {
    font-size: 12px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .value {
    font-size: 20px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>ATELIER</h1>
<p>Gemini AI Clothing Recognition Test</p>

<input
  type="file"
  id="photo"
  accept="image/jpeg,image/png,image/webp"
>

<img id="preview" alt="Clothing preview">

<br>

<button id="analyze" disabled>
  Analyze Clothing
</button>

<p id="status">Select a clothing photo to begin.</p>

<div id="results"></div>

<script>
const WORKER_URL =
  "https://atelier-ai.rlunsford001.workers.dev";

const input = document.getElementById("photo");
const preview = document.getElementById("preview");
const button = document.getElementById("analyze");
const status = document.getElementById("status");
const results = document.getElementById("results");

let selectedFile = null;
let previewURL = null;

input.addEventListener("change", () => {
  selectedFile = input.files[0] || null;
  results.replaceChildren();

  if (previewURL) {
    URL.revokeObjectURL(previewURL);
    previewURL = null;
  }

  if (!selectedFile) {
    preview.style.display = "none";
    button.disabled = true;
    status.textContent = "Select a clothing photo to begin.";
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(selectedFile.type)) {
    selectedFile = null;
    button.disabled = true;
    preview.style.display = "none";
    status.textContent = "Please choose a JPG, PNG, or WebP image.";
    return;
  }

  if (selectedFile.size > 9 * 1024 * 1024) {
    selectedFile = null;
    button.disabled = true;
    preview.style.display = "none";
    status.textContent = "Image is too large. Choose one under 9 MB.";
    return;
  }

  previewURL = URL.createObjectURL(selectedFile);
  preview.src = previewURL;
  preview.style.display = "block";

  button.disabled = false;
  status.textContent = "Ready to analyze.";
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      const result = reader.result;
      resolve(result.split(",")[1]);
    };

    reader.onerror = () => reject(
      new Error("Could not read the selected image.")
    );

    reader.readAsDataURL(file);
  });
}

function showResult(label, value) {
  const div = document.createElement("div");
  div.className = "result";

  const labelElement = document.createElement("div");
  labelElement.className = "label";
  labelElement.textContent = label;

  const valueElement = document.createElement("div");
  valueElement.className = "value";
  valueElement.textContent = value || "Unknown";

  div.append(labelElement, valueElement);
  results.appendChild(div);
}

button.addEventListener("click", async () => {
  if (!selectedFile) return;

  button.disabled = true;
  input.disabled = true;
  results.replaceChildren();

  try {
    status.textContent = "Preparing photo...";

    const base64 = await fileToBase64(selectedFile);

    status.textContent = "Gemini is analyzing your clothing...";

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: base64,
        mimeType: selectedFile.type
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI analysis failed.");
    }

    showResult("Clothing Type", data.type);
    showResult("Primary Color", data.color);
    showResult("Pattern", data.pattern);
    showResult("Brand", data.brand);

    status.textContent = "Analysis complete!";

  } catch (error) {
    status.textContent = "Error: " + error.message;
    console.error(error);
  } finally {
    button.disabled = false;
    input.disabled = false;
  }
});
</script>

</body>
</html>
